<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FD3B0"/><stop offset="1" stop-color="#139A8E"/></linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4EEF0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter>
    <filter id="in" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#064E47" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <g filter="url(#in)">
    <!-- the drive -->
    <rect x="232" y="590" width="560" height="210" rx="56" fill="url(#drive)"/>
    <rect x="292" y="675" width="300" height="40" rx="20" fill="#CFE0E3"/>
    <circle cx="712" cy="695" r="24" fill="#2DD4A8"/>
    <!-- blocks lifting out, getting smaller and lighter -->
    <rect x="404" y="400" width="132" height="132" rx="28" fill="#fff" transform="rotate(-8 470 466)"/>
    <rect x="560" y="290" width="100" height="100" rx="22" fill="#fff" opacity="0.75" transform="rotate(12 610 340)"/>
    <rect x="392" y="214" width="72" height="72" rx="16" fill="#fff" opacity="0.5" transform="rotate(-14 428 250)"/>
    <rect x="560" y="160" width="46" height="46" rx="10" fill="#fff" opacity="0.3" transform="rotate(8 583 183)"/>
  </g>
</svg>
