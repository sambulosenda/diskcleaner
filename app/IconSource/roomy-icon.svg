<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EA"/><stop offset="1" stop-color="#F3E3C7"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F8F8A"/><stop offset="1" stop-color="#27A79F"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3CC2B6"/><stop offset="1" stop-color="#2FB0A6"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F6F4"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <!-- isometric empty room: left wall, right wall, floor -->
  <polygon points="512,250 260,395 260,650 512,505" fill="url(#left)"/>
  <polygon points="512,250 764,395 764,650 512,505" fill="url(#right)"/>
  <polygon points="512,505 260,650 512,795 764,650" fill="url(#floor)"/>
  <!-- window on right wall -->
  <polygon points="590,370 690,428 690,520 590,462" fill="#FFF7EA" opacity="0.9"/>
  <g>
    <polygon points="340,600 300,623 340,646 380,623" fill="#FFD08A"/>
    <polygon points="300,623 300,673 340,696 340,646" fill="#F29A1F"/>
    <polygon points="380,623 380,673 340,696 340,646" fill="#FFB547"/>
  </g>
</svg>
