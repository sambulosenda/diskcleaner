[package]
name = "ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Not "ffi": a library called libffi.a would clash with the system libffi when linking.
name = "roomy_ffi"
# staticlib is what the app links; cdylib lets uniffi-bindgen read the interface in library mode.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Only used by scripts/build-ffi.sh to generate Swift bindings; keeps the CLI out of the app library.
bindgen = ["uniffi/cli"]
# Test-only commands: a constructor that scans any folder instead of the real home folder, and
# a fixture-home builder. Never enabled in the release app (see docs/command-contract.md).
testing = ["dep:fixtures"]

[dependencies]
classifier = { path = "../classifier" }
dirs = "6"
fixtures = { path = "../fixtures", optional = true }
libc = "0.2"
rules = { path = "../rules" }
scanner = { path = "../scanner" }
thiserror = "2"
tracing = "0.1"
uniffi = "0.32"

[dev-dependencies]
fixtures = { path = "../fixtures" }
tempfile = "3"
