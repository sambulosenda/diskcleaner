[package]
name = "fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Builds reproducible fake home folders for tests. Test infrastructure only; never part of the app."

[[bin]]
name = "make-fixtures"
path = "src/bin/make-fixtures.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
safety = { path = "../safety" }
serde_json = "1"
sha2 = "0.10"
