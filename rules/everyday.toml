[[rule]]
id = "logs.user"
version = 1
match.path = "Library/Logs/*"
category = "logs"
tier = "likely_safe"
confidence = "medium"
regenerable = false
mode = "simple"
per_item = true
title = "App logs"
explain = "Records apps write about what they did, mainly to help find problems."
risk = "If you are working with support on a problem, they may ask for these records."
action = "trash"

[[rule]]
id = "ios.software_update"
version = 1
match.path = "Library/iTunes/iPhone Software Updates/*.ipsw"
category = "downloads"
tier = "likely_safe"
confidence = "high"
regenerable = true
mode = "simple"
per_item = true
title = "iPhone software update"
explain = "A copy of iOS your Mac downloaded to update or restore an iPhone."
risk = "If you update or restore an iPhone from this Mac, it downloads the software again."
restore = "Your Mac downloads it again when needed."
action = "trash"
