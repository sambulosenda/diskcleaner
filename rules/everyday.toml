[[rule]]
id = "ios.software_update"
version = 1
match.path = "Library/iTunes/iPhone Software Updates/*.ipsw"
category = "downloads"
tier = "likely_safe"
confidence = "high"
regenerable = true
mode = "simple"
per_item = true
title = "iPhone software update"
explain = "A copy of iOS your Mac downloaded to update or restore an iPhone."
risk = "If you update or restore an iPhone from this Mac, it downloads the software again."
restore = "Your Mac downloads it again when needed."
action = "trash"

# ---------------------------------------------------------------------------
# More installers and app caches (first-scan coverage, 2026-11-11).
# Every rule below needs Sam's sign-off before release.
# ---------------------------------------------------------------------------

# Installer packages sit next to disk images in Downloads. Everything in
# Downloads is review-only in code (protected.rs) whatever this rule says.
[[rule]]
id = "downloads.installer_package"
version = 1
match.path = "Downloads/*.pkg"
category = "downloads"
tier = "review_first"
confidence = "medium"
regenerable = false
mode = "simple"
per_item = true
title = "Downloaded installer package"
explain = "An installer package you downloaded. Once the app or driver is installed, the package is often no longer needed."
risk = "If you still need it, you will have to download it again, and an older version may no longer be offered."
action = "trash"

# Only zips whose name says "installer". A zip in Downloads is just as often
# the user's own photos or documents, so a plain `*.zip` rule is not used,
# and this one is low confidence and never likely_safe.
[[rule]]
id = "downloads.zip_installer"
version = 1
match.path = "Downloads/*installer*.zip"
category = "downloads"
tier = "review_first"
confidence = "low"
regenerable = false
mode = "simple"
per_item = true
title = "Downloaded installer (zip)"
explain = "A zip file whose name says it holds an installer. Once the app is installed, it is often no longer needed."
risk = "Check what is inside first: if it holds anything else you want, it would go too. You may have to download it again."
action = "trash"

