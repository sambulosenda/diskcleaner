# Only the Cache folder. Discord's Local Storage (sign-in) and settings
# beside it are never matched.
[[rule]]
id = "discord.cache"
version = 1
match.path = "Library/Application Support/discord/Cache"
category = "cache"
tier = "likely_safe"
confidence = "high"
regenerable = true
mode = "simple"
title = "Discord cache"
explain = "Images and files Discord keeps so servers and chats open quickly."
risk = "Images in chats may take a moment to appear again. Your messages are kept by Discord online."
restore = "Discord saves them again as you use it."
action = "trash"

# The classic Teams app (retired by Microsoft in 2025) left this behind on
# many Macs. Only its Cache folder.
[[rule]]
id = "teams.classic_cache"
version = 1
match.path = "Library/Application Support/Microsoft/Teams/Cache"
category = "cache"
tier = "likely_safe"
confidence = "high"
regenerable = true
mode = "simple"
title = "Microsoft Teams (classic) cache"
explain = "Images and files the classic Microsoft Teams app kept so chats opened quickly."
risk = "If you still use classic Teams, images in chats may take a moment to appear again. Your chats are kept by Microsoft online."
restore = "Teams saves them again as you use it."
action = "trash"

# The new Teams app is sandboxed. Only the Caches folder inside its
# container, never its Application Support (sign-in, settings) or the
# Microsoft group container. Medium: not yet checked on a Mac with Teams.
[[rule]]
id = "teams.cache"
version = 1
match.path = "Library/Containers/com.microsoft.teams2/Data/Library/Caches"
category = "cache"
tier = "likely_safe"
confidence = "medium"
regenerable = true
mode = "simple"
title = "Microsoft Teams cache"
explain = "Files Microsoft Teams keeps so it opens and loads faster."
risk = "Teams may take a moment longer to load at first. Your chats, files and sign-in are kept."
restore = "Teams saves them again as you use it."
action = "trash"

# WhatsApp keeps messages and photos in its group container; that is never
# matched. Only the Caches folder inside the app's own container. Medium:
# not yet checked on a Mac with WhatsApp.
[[rule]]
id = "whatsapp.cache"
version = 1
match.path = "Library/Containers/net.whatsapp.WhatsApp/Data/Library/Caches"
category = "cache"
tier = "likely_safe"
confidence = "medium"
regenerable = true
mode = "simple"
title = "WhatsApp cache"
explain = "Files WhatsApp keeps so it opens and loads faster."
risk = "WhatsApp may take a moment longer to load at first. Your chats, photos and sign-in are kept."
restore = "WhatsApp saves them again as you use it."
action = "trash"
