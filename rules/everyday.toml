category = "cache"
tier = "likely_safe"
confidence = "high"
regenerable = true
mode = "simple"
title = "Chrome cache"
explain = "Copies of web pages and images Google Chrome keeps so sites load faster."
risk = "Websites may load a little slower at first. You stay signed in and keep your bookmarks and history."
restore = "Chrome saves pages again as you browse."
