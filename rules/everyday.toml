# Everyday rules (T07). Every rule's wording and tier needs Sam's sign-off.
# Bump `version` on any change to a rule.

[[rule]]
id = "ios.device_backup"
version = 2
match.path = "Library/Application Support/MobileSync/Backup/*"
match.requires = ["Info.plist"]
category = "backups"
tier = "review_first"
confidence = "high"
regenerable = false
mode = "simple"
per_item = true
title = "iPhone or iPad backup"
explain = "A full local backup of one of your devices."
risk = "This may be your only copy of this iPhone or iPad. Check it's backed up to iCloud first, or its photos, messages and other data could be lost for good."
action = "trash"

[[rule]]
id = "downloads.disk_image"
version = 1
match.path = "Downloads/*.dmg"
category = "downloads"
tier = "review_first"
confidence = "medium"
regenerable = false
mode = "simple"
per_item = true
title = "Downloaded installer"
explain = "A disk image you downloaded, usually to install an app. Once the app is installed, the image is often no longer needed."
risk = "If you still need it, you will have to download it again, and an older version may no longer be offered."
action = "trash"

[[rule]]
id = "browser.safari_cache"
version = 1
match.path = "Library/Caches/com.apple.Safari"
category = "cache"
tier = "likely_safe"
confidence = "high"
regenerable = true
mode = "simple"
title = "Safari cache"
explain = "Copies of web pages and images Safari keeps so sites load faster."
risk = "Websites may load a little slower at first. You stay signed in and keep your bookmarks and history."
restore = "Safari saves pages again as you browse."
action = "trash"

[[rule]]
