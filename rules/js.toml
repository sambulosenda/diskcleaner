# JavaScript rules (T07). Every rule's wording and tier needs Sam's sign-off.
# Bump `version` on any change to a rule.

# node_modules folders. A rule may not match `**/node_modules` across the
# whole home folder (it could reach protected places such as Keychains), so
# there is one rule for each common code folder. `**` finds projects at any
# depth inside it; the walk stops at the first node_modules, so packages
# nested inside one are part of it.
#
# js.node_modules_home finds a project folder straight inside home, one
# level only. `[!.]` leaves out hidden folders such as .vscode, .cursor and
# .nvm: their node_modules belong to editor extensions and Node installs,
# not to projects. Desktop is left out on purpose until Sam decides.

[[rule]]
id = "js.node_modules"
version = 2
match.path = "projects/**/node_modules"
category = "build"
tier = "review_first"
confidence = "high"
regenerable = true
mode = "developer"
per_item = true
title = "Project packages (node_modules)"
explain = "The packages one JavaScript project has downloaded. The project lists them, so they can be fetched again."
risk = "The project will not run until you install its packages again, which needs a network connection."
restore = "Run npm install (or your project's install command) in the project folder."
action = "trash"

