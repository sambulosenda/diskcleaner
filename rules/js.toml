[[rule]]
id = "js.npm_cache"
version = 1
match.path = ".npm/_cacache"
category = "cache"
tier = "likely_safe"
confidence = "high"
regenerable = true
mode = "developer"
title = "npm download cache"
explain = "Copies of packages npm has downloaded, kept so later installs are faster."
risk = "The next install downloads packages again, which takes longer."
restore = "npm fills the cache again as you install packages."
action = "trash"

[[rule]]
id = "js.npx_cache"
version = 1
match.path = ".npm/_npx"
category = "cache"
tier = "likely_safe"
confidence = "medium"
regenerable = true
mode = "developer"
title = "npx tool cache"
explain = "Command-line tools that npx has downloaded to run once, such as project starters."
risk = "The next time you run one of these tools with npx, it is downloaded again."
restore = "npx downloads each tool again when you next run it."
action = "trash"

[[rule]]
id = "js.pnpm_store"
version = 1
match.path = "Library/pnpm/store"
category = "cache"
tier = "review_first"
confidence = "medium"
regenerable = true
mode = "developer"
title = "pnpm package store"
explain = "The shared copy of every package pnpm has installed. Projects point to the files here instead of keeping their own copies."
risk = "Projects need their packages installed again. Space shared with existing projects is freed only once they are removed too."
restore = "pnpm fills the store again as you install packages."
action = "trash"

